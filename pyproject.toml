[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-project-transfer"
version = "0.6.3"
description = "Command-line import, export, and Git transfer of native Codex project conversations"
readme = "README.en.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["build>=1.2", "setuptools>=68", "wheel"]

[project.scripts]
cpt = "codex_project_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
